name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache the audio model
        uses: actions/cache@v4
        with:
          path: src/MelodayMusic.App/Assets/Engine/audio.onnx
          key: meloday-engine-9533ed82

      - name: Download the audio model
        shell: pwsh
        run: ./tools/engine/download.ps1

      - name: Restore
        run: dotnet restore MelodayMusic.sln -p:Platform=x64

      - name: Build
        run: dotnet build MelodayMusic.sln -c Release -p:Platform=x64 -p:WindowsAppSDKSelfContained=false -p:SelfContained=false -p:UseSharedCompilation=false -m:1 --no-restore

      - name: Test
        run: dotnet test MelodayMusic.sln -c Release -p:Platform=x64 --no-build --no-restore
